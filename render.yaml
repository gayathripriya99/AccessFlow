services:
  - type: web
    name: accessflow-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: REFRESH_COOKIE_NAME
        value: accessflow_refresh_token
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: AUTH_RATE_LIMIT_MAX
        value: '20'
      - key: LOG_LEVEL
        value: info
